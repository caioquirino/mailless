name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      # The storage and ingest tests must run here, not be skipped. Nx starts the
      # containers they need as a dependency of those test tasks.
      REQUIRE_LOCAL_SERVICES: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Terraform at the version pinned in mise.toml; Node comes from the matrix below.
      - uses: jdx/mise-action@v3
        with:
          install_args: terraform

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx sync:check
      - run: pnpm nx format:check
      - run: pnpm nx affected -t lint typecheck validate test build

  # Fastmail's JMAP-TestSuite against the dev server. Fails when something that
  # passed in tools/compliance/baseline.json no longer does.
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm compliance
